[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Point the frontend at your deployed Vercel backend.
#
# Set VITE_API_URL as an environment variable in the Netlify dashboard:
#   Site configuration -> Environment variables
#   VITE_API_URL = "https://your-backend.vercel.app"
#
# It must be set for PRODUCTION builds (Vite bakes it into the bundle).
# Locally it is intentionally left empty - the Vite dev server proxies
# /api to http://localhost:5000 via vite.config.js.
# ---------------------------------------------------------------------------
